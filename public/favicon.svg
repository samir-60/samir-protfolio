<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  <!-- Stylized 3D S Monogram -->
  <path d="M65 32 C65 24, 35 20, 35 34 C35 48, 65 46, 65 62 C65 78, 32 76, 32 66" 
        fill="none" 
        stroke="url(#grad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <circle cx="68" cy="28" r="4" fill="#38bdf8" />
  <circle cx="32" cy="72" r="4" fill="#c084fc" />
</svg>
